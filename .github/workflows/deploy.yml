name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - test-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Inject secrets
        run: |
          sed -i "s/GEMINI_KEY_PLACEHOLDER/${{ secrets.GEMINI_KEY }}/g" config.js
          sed -i "s/FINNHUB_KEY_PLACEHOLDER/${{ secrets.FINNHUB_KEY }}/g" config.js

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./src