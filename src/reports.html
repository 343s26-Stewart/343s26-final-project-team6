    <nav id="nav-mobile">
        <a href="index.html" id="logo">StalkStocks</a>
        <button id="nav-menu-button" aria-label="Open menu">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" 
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" 
                stroke-linejoin="round" id="nav-menu-svg">

    <!-- content container-->
    <div id="content-container">

        <!-- Place html for chart in div below -->
        <div id="chart-container">

        </div>


        <div id="form-reports-container">
            <div id="stock-reports">

            </div>
            <form id="form">
                <div id="buy">

                    <label for="sharesInput"></label>
                    <input type="number" id="sharesInput" name="shares" placeholder="Shares">
                    <br>

                    <label for="limitInput"></label>
                    <input type="number" id="limitInput" name="limit" placeholder="Limit">
                    <br>

                    <label for="takeProfitInput"></label>
                    <input type="number" id="takeProfitInput" name="takeProfit" placeholder="Take Profit">
                    <br>

                    <button type="submit" id="buy-button">Buy</button>
                </div>

                <div id="sell">
                    <label for="leverageInput"></label>
                    <input type="number" id="leverageInput" name="leverage" placeholder="Leverage" >
                    <br>

                    <!-- what should this field be? -->
                    <label for="tbd"></label>
                    <input type="number" id="tbd" name="tbd" placeholder="???">
                    <br>

                    <label for="stopLossInput"></label>
                    <input type="number" id="stopLossInput" name="stopLoss" placeholder="Stop Loss">
                    <br>
                    <button type="submit" id="sell-button">Sell</button>
                </div>
            </form>
        </div>
    </div>
